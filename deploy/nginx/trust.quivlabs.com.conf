# LDIF Builder — trust.quivlabs.com
# 1) Copy to /etc/nginx/sites-available/
# 2) Symlink into /etc/nginx/sites-enabled/  (required — available alone does nothing)
# 3) nginx -t && systemctl reload nginx
# 4) certbot --nginx -d trust.quivlabs.com
# After Certbot, do not overwrite this live file with the git template (TLS blocks are added).
#
# Upstream: ldap-utility on 127.0.0.1:3012 (deploy/docker-compose.yml).

server {
	listen 80;
	listen [::]:80;
	server_name trust.quivlabs.com;

	client_max_body_size 32m;

	location / {
		proxy_pass http://127.0.0.1:3012;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}
}
